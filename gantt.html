<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約図解</title>
    <style>
        /* 他のページと完全に統一した基本スタイル */
        body { margin: 0; font-family: sans-serif; background-color: #f5f5f5; color: #333; }
        header { background-color: #006400; color: white; padding: 15px; position: sticky; top: 0; z-index: 110; }
        .header-content { max-width: 600px; margin: 0 auto; width: 100%; display: flex; align-items: center; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; margin-right: 15px; }
        
        .top-nav { background: white; border-bottom: 1px solid #ddd; position: sticky; top: 54px; z-index: 100; }
        .nav-inner { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-around; }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 12px; color: #666; text-decoration: none; border-bottom: 3px solid transparent; }
        .nav-item.active { color: #006400; font-weight: bold; border-bottom: 3px solid #006400; }
        .nav-icon { font-size: 18px; display: block; margin-bottom: 2px; }

        .container { max-width: 600px; margin: 0 auto; padding: 10px; box-sizing: border-box; }

        /* 月選択の操作エリア */
        .month-picker { 
            display: flex; justify-content: center; align-items: center; 
            background: white; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd;
        }
        .month-btn { background: #eee; border: 1px solid #ccc; padding: 5px 15px; border-radius: 4px; cursor: pointer; }
        #currentMonthDisplay { margin: 0 20px; font-weight: bold; }

        /* 支所セクション（アコーディオン）を他のページと統一 */
        .branch-section { margin-bottom: 15px; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #ddd; }
        .branch-header { 
            background: #fff; padding: 15px; display: flex; justify-content: space-between; 
            align-items: center; cursor: pointer; font-weight: bold; font-size: 15px; border-bottom: 1px solid #eee;
        }
        .branch-content { display: none; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .branch-content.show { display: block; }
        .arrow { transition: transform 0.3s; color: #666; }
        .arrow.open { transform: rotate(180deg); }

        /* テーブルスタイル */
        table { border-collapse: collapse; width: 100%; min-width: 400px; background: white; }
        th, td { border: 1px solid #eee; padding: 5px; text-align: center; font-size: 11px; }
        .device-col { width: 80px; position: sticky; left: 0; background: #f9f9f9; z-index: 10; font-weight: bold; }
        .day-col { min-width: 25px; }

        /* ステータス色 */
        .status-cell { width: 100%; height: 20px; border-radius: 2px; }
        .waiting { background-color: #2196F3; } /* 空き */
        .reserved { background-color: #4CAF50; } /* 予約 */
        .rented { background-color: #FF9800; }   /* 貸出 */
        .stopped { background-color: #F44336; }  /* 停止 */
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <button class="back-btn" onclick="location.href='index.html'">◀</button>
        <div style="font-weight: bold;">予約図解</div>
    </div>
</header>

<nav class="top-nav">
    <div class="nav-inner">
        <a href="reservation.html" class="nav-item"><span class="nav-icon">📋</span>一覧</a>
        <a href="reservation_list.html" class="nav-item"><span class="nav-icon">📅</span>予約</a>
        <a href="rental_list.html" class="nav-item"><span class="nav-icon">📤</span>貸出</a>
        <a href="return_history.html" class="nav-item"><span class="nav-icon">🕒</span>履歴</a>
        <a href="gantt.html" class="nav-item active"><span class="nav-icon">📊</span>図解</a>
    </div>
</nav>

<div class="container">
    <div class="month-picker">
        <button class="month-btn" onclick="changeMonth(-1)">◀ 前月</button>
        <span id="currentMonthDisplay"></span>
        <button class="month-btn" onclick="changeMonth(1)">次月 ▶</button>
    </div>
    <div id="branchContainer"></div>
</div>

<script>
    const API_BASE = "http://192.168.1.50:3001";
    let currentYear, currentMonth;

    window.onload = () => {
        const now = new Date();
        currentYear = now.getFullYear();
        currentMonth = now.getMonth();
        loadAllData();
    };

    function changeMonth(diff) {
        const date = new Date(currentYear, currentMonth + diff, 1);
        currentYear = date.getFullYear();
        currentMonth = date.getMonth();
        loadAllData();
    }

    async function loadAllData() {
        document.getElementById('currentMonthDisplay').textContent = `${currentYear}年${currentMonth + 1}月`;
        const container = document.getElementById('branchContainer');
        container.innerHTML = "読み込み中...";

        try {
            const [bRes, dRes, rRes, rentRes, sRes] = await Promise.all([
                fetch(`${API_BASE}/branches`), fetch(`${API_BASE}/devices`),
                fetch(`${API_BASE}/reservations`), fetch(`${API_BASE}/rentals`),
                fetch(`${API_BASE}/status`)
            ]);
            const [branches, devices, reservations, rentals, statusList] = await Promise.all([
                bRes.json(), dRes.json(), rRes.json(), rentRes.json(), sRes.json()
            ]);

            container.innerHTML = "";
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            branches.forEach(branch => {
                const bDevices = devices.filter(d => d.branchId === branch.id);
                if (bDevices.length === 0) return;

                const section = document.createElement('div');
                section.className = 'branch-section';

                let headHtml = `<tr><th class="device-col">機器名</th>`;
                for (let i = 1; i <= daysInMonth; i++) {
                    headHtml += `<th class="day-col">${i}</th>`;
                }
                headHtml += `</tr>`;

                let bodyHtml = "";
                bDevices.forEach(dev => {
                    bodyHtml += `<tr><td class="device-col">${dev.name}</td>`;
                    for (let d = 1; d <= daysInMonth; d++) {
                        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        const status = getStatusForDate(dev.id, dateStr, reservations, rentals, statusList);
                        bodyHtml += `<td class="day-col"><div class="status-cell ${status}"></div></td>`;
                    }
                    bodyHtml += `</tr>`;
                });

                section.innerHTML = `
                    <div class="branch-header" onclick="toggleBranch(this)">
                        <span>${branch.name}（${bDevices.length}台）</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="branch-content">
                        <table><thead>${headHtml}</thead><tbody>${bodyHtml}</tbody></table>
                    </div>
                `;
                container.appendChild(section);
            });
        } catch (e) {
            container.innerHTML = "通信エラーが発生しました";
        }
    }

    function toggleBranch(header) {
        header.nextElementSibling.classList.toggle('show');
        header.querySelector('.arrow').classList.toggle('open');
    }

    function getStatusForDate(deviceId, dateStr, reservations, rentals, statusList) {
        // 1. 停止中
        const st = statusList.find(s => s.deviceId === deviceId);
        if (st && st.status === "停止中") return "stopped";

        // 2. 貸出中
        const rental = rentals.find(r => r.deviceId === deviceId && r.date <= dateStr && (!r.expectedReturnDate || dateStr <= r.expectedReturnDate));
        if (rental) return "rented";

        // 3. 予約あり
        const res = reservations.find(r => r.deviceId === deviceId && (r.dateFrom || r.date) <= dateStr && dateStr <= (r.dateTo || r.returnDate));
        if (res) return "reserved";

        return "waiting";
    }
</script>
</body>
</html>
