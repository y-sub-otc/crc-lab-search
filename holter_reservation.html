<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ホルター予約システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 p-4">

  <h1 class="text-xl font-bold mb-4">ホルター予約システム</h1>

  <div id="userArea" class="mb-4 text-sm text-slate-600"></div>

  <div class="bg-white p-4 rounded-xl shadow mb-6">
    <h2 class="font-bold mb-2">予約一覧</h2>
    <div id="reservationList" class="space-y-2 text-sm"></div>
  </div>

  <div class="bg-white p-4 rounded-xl shadow">
    <h2 class="font-bold mb-2">新規予約</h2>

    <select id="branch" class="w-full border p-2 rounded mb-2"></select>
    <select id="device" class="w-full border p-2 rounded mb-2"></select>

    <input id="date" type="date" class="w-full border p-2 rounded mb-2">
    <input id="time" type="time" class="w-full border p-2 rounded mb-2">

    <textarea id="note" placeholder="備考" class="w-full border p-2 rounded mb-2"></textarea>

    <button onclick="addReservation()"
      class="w-full bg-green-700 text-white py-2 rounded-lg font-bold">
      予約する
    </button>
  </div>

<script>
const baseUrl = "http://192.168.1.50:3001";

async function fetchJson(url) {
  const res = await fetch(url);
  return await res.json();
}

async function loadInitial() {
  const user = localStorage.getItem("holterUser");
  if (!user) {
    window.location.href = "holter_login.html";
    return;
  }
  document.getElementById("userArea").textContent = `ログイン中: ${user}`;

  const branches = await fetchJson(`${baseUrl}/branches`);
  const devices = await fetchJson(`${baseUrl}/devices`);
  const reservations = await fetchJson(`${baseUrl}/reservations`);

  const branchSel = document.getElementById("branch");
  branches.forEach(b => {
    branchSel.innerHTML += `<option value="${b.id}">${b.name}</option>`;
  });

  const deviceSel = document.getElementById("device");
  devices.forEach(d => {
    deviceSel.innerHTML += `<option value="${d.id}">${d.name}</option>`;
  });

  const list = document.getElementById("reservationList");
  reservations.forEach(r => {
    list.innerHTML += `
      <div class="p-2 border rounded">
        <div>支所: ${r.branchId}</div>
        <div>機器: ${r.deviceId}</div>
        <div>${r.date} ${r.time}</div>
        <div>${r.user}</div>
      </div>
    `;
  });
}

async function addReservation() {
  const user = localStorage.getItem("holterUser");

  const body = {
    branchId: Number(branch.value),
    deviceId: Number(device.value),
    user: user,
    date: date.value,
    time: time.value,
    note: note.value
  };

  const res = await fetch(`${baseUrl}/reservations/add`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });

  if (res.status === 200) {
    alert("予約しました");
    location.reload();
  } else {
    alert("予約に失敗しました");
  }
}

loadInitial();
</script>

</body>
</html>
