<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機器予約・管理</title>
    <style>
        /* スタイルは維持（ワイド画面対応済） */
        body { margin: 0; font-family: sans-serif; background-color: #f5f5f5; padding-top: 10px; }
        header { background-color: #006400; color: white; padding: 15px; position: sticky; top: 0; z-index: 110; }
        .header-content { max-width: 600px; margin: 0 auto; width: 100%; display: flex; align-items: center; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; margin-right: 15px; }
        .top-nav { background: white; border-bottom: 1px solid #ddd; position: sticky; top: 54px; z-index: 100; }
        .nav-inner { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-around; }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 12px; color: #666; text-decoration: none; border-bottom: 3px solid transparent; }
        .nav-item.active { color: #006400; font-weight: bold; border-bottom: 3px solid #006400; }
        .nav-icon { font-size: 18px; display: block; margin-bottom: 2px; }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; box-sizing: border-box; }
        .branch-section { margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
        .branch-header { background: #eee; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; font-size: 14px; }
        .branch-content { display: none; background: #fff; }
        .branch-content.show { display: block; }
        .arrow { transition: transform 0.3s; font-size: 12px; }
        .arrow.open { transform: rotate(180deg); }
        .device-card { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .device-name { font-weight: bold; font-size: 15px; }
        .status-badge { padding: 3px 8px; border-radius: 4px; color: white; font-size: 10px; }
        .waiting { background: #2196F3; } .reserved { background: #4CAF50; } .rented { background: #FF9800; } .stopped { background: #F44336; }
        
        /* モーダル：ワイド対応 */
        #modalOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 200; }
        #modalContent { 
            position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%); 
            width: 100%; max-width: 600px; background: white; 
            border-top-left-radius: 20px; border-top-right-radius: 20px; transition: bottom 0.3s ease; z-index: 210;
        }
        #modalContent.show { bottom: 0; }
        .modal-header { padding: 15px; border-bottom: 1px solid #eee; text-align: center; font-weight: bold; }
        .modal-btn { width: 100%; padding: 15px; border: none; background: none; text-align: left; font-size: 16px; cursor: pointer; display: flex; align-items: center; }
    </style>
</head>
<body>

<header><div class="header-content"><button class="back-btn" onclick="location.href='index.html'">◀</button><b>機器予約・管理</b></div></header>

<nav class="top-nav">
    <div class="nav-inner">
        <a href="reservation.html" class="nav-item active"><span class="nav-icon">📋</span>一覧</a>
        <a href="reservation_list.html" class="nav-item"><span class="nav-icon">📅</span>予約</a>
        <a href="rental_list.html" class="nav-item"><span class="nav-icon">📤</span>貸出</a>
        <a href="return_history.html" class="nav-item"><span class="nav-icon">🕒</span>履歴</a>
        <a href="gantt.html" class="nav-item"><span class="nav-icon">📊</span>図解</a>
    </div>
</nav>

<div class="container" id="mainContainer"></div>

<div id="modalOverlay" onclick="closeModal()"></div>
<div id="modalContent">
    <div class="modal-header" id="selectedDeviceName"></div>
    <div class="modal-body" id="modalButtons"></div>
    <div style="padding: 10px;"><button class="modal-btn" onclick="closeModal()" style="color: #999; justify-content: center;">閉じる</button></div>
</div>

<script>
    const API_BASE = "http://192.168.1.50:3001";

    window.onload = async () => {
        // --- キャッシュ/履歴対策：ハッシュを消去し、自動メニューを防ぐ ---
        if (window.location.hash) {
            history.replaceState("", document.title, window.location.pathname + window.location.search);
        }

        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user) { location.href = 'holter_login.html'; return; }
        
        await loadData();

        // 支所の開閉状態だけ復元
        const savedBranchId = localStorage.getItem('last_active_branch');
        if (savedBranchId) {
            const content = document.getElementById(`branch-content-${savedBranchId}`);
            const arrow = document.getElementById(`arrow-${savedBranchId}`);
            if (content) {
                content.classList.add('show');
                if (arrow) arrow.classList.add('open');
            }
        }
    };

    async function loadData() {
        const container = document.getElementById('mainContainer');
        container.innerHTML = "読み込み中...";
        try {
            const [bRes, dRes, sRes, rRes, rentRes] = await Promise.all([
                fetch(`${API_BASE}/branches`), fetch(`${API_BASE}/devices`),
                fetch(`${API_BASE}/status`), fetch(`${API_BASE}/reservations`),
                fetch(`${API_BASE}/rentals`)
            ]);
            const [branches, devices, statusList, reservations, rentals] = await Promise.all([bRes.json(), dRes.json(), sRes.json(), rRes.json(), rentRes.json()]);

            container.innerHTML = "";
            branches.forEach(branch => {
                const bDevices = devices.filter(d => d.branchId === branch.id);
                let cardsHtml = "";
                bDevices.forEach(dev => {
                    const status = statusList.find(s => s.deviceId === dev.id) || { status: "待機中" };
                    const badgeClass = { '待機中': 'waiting', '予約あり': 'reserved', '貸し出し中': 'rented', '停止中': 'stopped' }[status.status];
                    
                    cardsHtml += `
                        <div class="device-card" onclick='openManualMenu(${JSON.stringify(dev)}, ${JSON.stringify(status)})'>
                            <div class="card-header">
                                <span class="device-name">${dev.name}</span>
                                <span class="status-badge ${badgeClass}">${status.status}</span>
                            </div>
                        </div>`;
                });
                const div = document.createElement('div');
                div.className = 'branch-section';
                div.innerHTML = `
                    <div class="branch-header" onclick="toggleBranch(${branch.id})">
                        <span>${branch.name}（${bDevices.length}台）</span>
                        <span class="arrow" id="arrow-${branch.id}">▼</span>
                    </div>
                    <div class="branch-content" id="branch-content-${branch.id}">${cardsHtml}</div>`;
                container.appendChild(div);
            });
        } catch (e) { container.innerHTML = "エラー"; }
    }

    function toggleBranch(id) {
        const content = document.getElementById(`branch-content-${id}`);
        const arrow = document.getElementById(`arrow-${id}`);
                const isShow = content.classList.toggle('show');
        arrow.classList.toggle('open');
        if (isShow) localStorage.setItem('last_active_branch', id);
        else localStorage.removeItem('last_active_branch');
    }

    // 手動クリック時のみ動くメニュー
    function openManualMenu(device, status) {
        localStorage.setItem('last_active_branch', device.branchId);
        document.getElementById('selectedDeviceName').textContent = device.name;
        const btnArea = document.getElementById('modalButtons');
        btnArea.innerHTML = "";

        if (status.status === "停止中") {
            addBtn(btnArea, "✅", "停止を解除する", () => clearStatus(device.id, device.branchId));
        } else if (status.status === "貸し出し中") {
            addBtn(btnArea, "🔍", "詳細を見る", () => location.href=`detail.html?id=${device.id}&branchId=${device.branchId}`);
        } else {
            addBtn(btnArea, "📅", "予約を登録", () => location.href=`reservation_form.html?id=${device.id}&branchId=${device.branchId}&name=${encodeURIComponent(device.name)}`);
            addBtn(btnArea, "🔍", "詳細を見る", () => location.href=`detail.html?id=${device.id}&branchId=${device.branchId}`);
            addBtn(btnArea, "⚠️", "状態変更", () => location.href=`status_change.html?id=${device.id}&branchId=${device.branchId}&name=${encodeURIComponent(device.name)}`);
        }
        document.getElementById('modalOverlay').style.display = 'block';
        setTimeout(() => document.getElementById('modalContent').classList.add('show'), 10);
    }

    function addBtn(parent, icon, text, onclick) {
        const btn = document.createElement('button');
        btn.className = 'modal-btn';
        btn.onclick = onclick;
        btn.innerHTML = `<i>${icon}</i> ${text}`;
        parent.appendChild(btn);
    }

    function closeModal() {
        document.getElementById('modalContent').classList.remove('show');
        setTimeout(() => document.getElementById('modalOverlay').style.display = 'none', 300);
    }
</script>
</body>
</html>
