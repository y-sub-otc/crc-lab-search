<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>返却履歴</title>
    <style>
        body { margin: 0; font-family: sans-serif; background-color: #f5f5f5; color: #333; }
        
        /* ヘッダー・ナビゲーション */
        header { background-color: #006400; color: white; padding: 15px; position: sticky; top: 0; z-index: 110; }
        .header-content { max-width: 600px; margin: 0 auto; width: 100%; display: flex; align-items: center; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; margin-right: 15px; }
        .top-nav { background: white; border-bottom: 1px solid #ddd; position: sticky; top: 54px; z-index: 100; }
        .nav-inner { max-width: 600px; margin: 0 auto; display: flex; justify-content: space-around; }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 12px; color: #666; text-decoration: none; border-bottom: 3px solid transparent; }
        .nav-item.active { color: #006400; font-weight: bold; border-bottom: 3px solid #006400; }
        .nav-icon { font-size: 18px; display: block; margin-bottom: 2px; }

        /* コンテンツエリア */
        .container { max-width: 600px; margin: 0 auto; padding: 10px; box-sizing: border-box; }
        
        /* 支所セクション */
        .branch-section { background: white; margin-bottom: 1px; border-bottom: 1px solid #eee; }
        .branch-header { 
            padding: 15px; display: flex; justify-content: space-between; align-items: center; 
            cursor: pointer; font-weight: bold; font-size: 16px; 
        }
        .branch-header:hover { background-color: #fafafa; }
        .branch-content { display: none; padding: 10px; background-color: #fff; }
        .branch-content.show { display: block; }

        /* 履歴カード */
        .res-card { 
            border: 1px solid #ddd; border-radius: 10px; padding: 16px; 
            margin-bottom: 12px; background: white; 
        }
        .res-row { margin-bottom: 8px; font-size: 14px; display: flex; }
        .res-label { color: #666; width: 110px; flex-shrink: 0; }
        .res-value { font-weight: 500; color: #000; }
        .res-device { font-weight: bold; font-size: 15px; color: #006400; }

        .empty-msg { padding: 20px; text-align: center; color: #999; font-size: 14px; }
        .arrow { transition: transform 0.3s; }
        .arrow.open { transform: rotate(180deg); }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <button class="back-btn" onclick="location.href='reservation.html'">◀</button>
        <div style="font-weight: bold;">返却履歴</div>
    </div>
</header>

<nav class="top-nav">
    <div class="nav-inner">
        <a href="reservation.html" class="nav-item"><span class="nav-icon">📋</span>一覧</a>
        <a href="reservation_list.html" class="nav-item"><span class="nav-icon">📅</span>予約</a>
        <a href="rental_list.html" class="nav-item"><span class="nav-icon">📤</span>貸出</a>
        <a href="return_history.html" class="nav-item active"><span class="nav-icon">🕒</span>履歴</a>
        <a href="gantt.html" class="nav-item"><span class="nav-icon">📊</span>図解</a>
    </div>
</nav>

<div class="container" id="mainContainer">
    </div>

<script>
    const API_BASE = "http://192.168.1.50:3001";

    window.onload = async () => {
        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user) { location.href = 'holter_login.html'; return; }
        await loadHistoryData();
    };

    async function loadHistoryData() {
        const container = document.getElementById('mainContainer');
        container.innerHTML = "<div class='empty-msg'>読み込み中...</div>";

        try {
            const [bRes, dRes, rRes] = await Promise.all([
                fetch(`${API_BASE}/branches`),
                fetch(`${API_BASE}/devices`),
                fetch(`${API_BASE}/returns`)
            ]);
            
            const branches = await bRes.json();
            const devices = await dRes.json();
            const returns = await rRes.json();
            
            container.innerHTML = "";

            branches.forEach(branch => {
                // その支所に属する機器のIDリストを取得
                const branchDeviceIds = devices.filter(d => d.branchId === branch.id).map(d => d.id);
                // その支所の機器に関連する返却履歴をフィルタ
                const branchReturns = returns.filter(r => branchDeviceIds.includes(r.deviceId));
                
                const section = document.createElement('div');
                section.className = 'branch-section';
                
                section.innerHTML = `
                    <div class="branch-header" onclick="toggleBranch(this)">
                        <span>${branch.name}（${branchReturns.length}件）</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="branch-content">
                        ${branchReturns.length === 0 ? '<div class="empty-msg">履歴なし</div>' : ''}
                    </div>
                `;
                
                const contentDiv = section.querySelector('.branch-content');
                
                // 履歴を日付の新しい順に並び替え
                branchReturns.sort((a, b) => b.date.localeCompare(a.date));

                branchReturns.forEach(r => {
                    const device = devices.find(d => d.id === r.deviceId);
                    const deviceName = device ? device.name : "不明な機器";
                    
                    const card = document.createElement('div');
                    card.className = 'res-card';
                    card.innerHTML = `
                        <div class="res-row"><span class="res-label">機器名：</span><span class="res-value res-device">${deviceName}</span></div>
                        <div class="res-row"><span class="res-label">利用者：</span><span class="res-value">${r.user}</span></div>
                        <div class="res-row"><span class="res-label">返却日：</span><span class="res-value">${r.date}</span></div>
                        <div class="res-row"><span class="res-label">返却時の状態：</span><span class="res-value">${r.condition || "-"}</span></div>
                        <div class="res-row"><span class="res-label">備考：</span><span class="res-value">${r.note || "-"}</span></div>
                    `;
                    contentDiv.appendChild(card);
                });
                
                container.appendChild(section);
            });
        } catch (e) {
            container.innerHTML = "<div class='empty-msg'>通信エラーが発生しました</div>";
        }
    }

    function toggleBranch(header) {
        header.nextElementSibling.classList.toggle('show');
        header.querySelector('.arrow').classList.toggle('open');
    }
</script>

</body>
</html>
